<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı İstatistik AI Advisor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        #chat-box { border: 1px solid #eee; height: 400px; overflow-y: auto; padding: 15px; margin-bottom: 20px; background: #fafafa; border-radius: 8px; display: flex; flex-direction: column; }
        .msg { margin-bottom: 15px; padding: 10px 15px; border-radius: 8px; line-height: 1.5; max-width: 85%; }
        .user-msg { background: #e1f5fe; color: #0277bd; align-self: flex-end; font-weight: bold; text-align: right; }
        .bot-msg { background: #f1f8e9; color: #33691e; white-space: pre-wrap; border-left: 4px solid #8bc34a; align-self: flex-start; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        button { padding: 12px 25px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .error-msg { color: #d32f2f; background: #ffcdd2; align-self: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Akıllı İstatistik Advisor</h2>
        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Araştırma probleminizi yazın..." onkeypress="if(event.key === 'Enter') gonder()">
            <button onclick="gonder()">Sor</button>
        </div>
    </div>

    <script>
        async function gonder() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const soru = input.value.trim();

            if(!soru) return;

            chatBox.innerHTML += `<div class="msg user-msg">Siz: ${soru}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // KRİTİK DEĞİŞİKLİK: Buraya Render adresini tam olarak yazdık
                const response = await fetch('https://webb-y2sq.onrender.com/soru-sor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ soru: soru })
                });
                
                const data = await response.json();

                if (response.ok && data.cevap) {
                    chatBox.innerHTML += `<div class="msg bot-msg">AI: ${data.cevap}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="msg error-msg">Hata: ${data.hata || 'Yapay zeka şu an meşgul.'}</div>`;
                }
            } catch (error) {
                console.error("Hata:", error);
                chatBox.innerHTML += `<div class="msg error-msg">Bağlantı Hatası: Sunucuya ulaşılamıyor (Render uyanıyor olabilir, 1 dk bekleyip tekrar deneyin).</div>`;
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
